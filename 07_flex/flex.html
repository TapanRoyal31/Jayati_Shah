<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
        height: 500px;
        width: 600px;
        border: 2px solid red;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: row-reverse;
        gap: 5px;
    }
    .box{
        background-color: aqua;
        height: 100px;
        width: 100px;
        flex-shrink: 1;
        flex-grow: 1;
    }
    .grow{
        flex-grow: 5;
    }
    .shrink{
        flex-shrink: 5;
    }
</style>
<body>
    <div class="container">
        <div class="box grow">01</div>
        <div class="box">02</div>
        <div class="box shrink">03</div>
    </div>
</body>
</html>
