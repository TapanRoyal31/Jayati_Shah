<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      height: 100vh;
    }

    h1:hover{
        text-decoration: underline blue dashed;
        border: 2px solid red;
    }
    input::placeholder{
        background: blue;
        scale: 1.2;
    }

    h1{
        font-size: max(34px,82px);
        font-size: min(12px,10px);
        font-size: calc(60px - 25px);
    }
    .parent:nth-child(n +3){
        color: red;
    }
</style>
<body>
    <h1>hello css</h1>
    <input type="text" placeholder="click on me">
    <div>
        <div class="parent">01</div>
        <div class="parent">02</div>
        <div class="parent">03</div>
        <div class="parent">04</div>
        <div class="parent">05</div>
    </div>
</body>
</html>
