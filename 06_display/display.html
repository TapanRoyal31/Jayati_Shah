<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      height: 100vh;
    }

    /*  
        div :- block element h and w apply
        span :- inline element h and w not applicable
    */

    div,
    span {
      border: 2px solid red;
      height: 100px;
      width: 100px;
    }
    div,
    span {
      display: inline-block;
    }
    table {
      border: 2px solid red;
    }
  </style>
  <body>
    <div>div text</div>
    <span>span text</span>
    <table>
      <tr>
        <td>hello</td>
        <td>hello</td>
        <td>hello</td>
      </tr>
    </table>
  </body>
</html>
