<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box{
        height: 250px;
        width: 250px;
        border: 2px solid red;
        /* background-color: #fff; */
        /* background-image: url(https://png.pngtree.com/thumb_back/fh260/background/20240520/pngtree-bokeh-effect-images-hd-for-cb-photo-park-editing-background-full-image_15804399.jpg);
        background-size: 100px;
        background-repeat: no-repeat;
        padding: 10px;
        background-clip: content-box;
        background-position: 20px 50px;
        background: url(https://png.pngtree.com/thumb_back/fh260/background/20240520/pngtree-bokeh-effect-images-hd-for-cb-photo-park-editing-background-full-image_15804399.jpg) content-box no-repeat 100px; */
        background-image: linear-gradient(45deg, red 30%, blue 50% 70%, green 80%);
        background-image: repeating-linear-gradient(0deg, aqua 10px 20px, blue 30px 40px);
        background-image: radial-gradient(circle at top, aqua 25%, blue 50% , red 75%);
        background-image: repeating-radial-gradient(circle at left, aqua 50px, blue 100px,red 150px);
        background-image: conic-gradient(aqua 45deg,blue 60deg 90deg, aquamarine 120deg 180deg, red 200deg);
    }
</style>
<body>
    <div class="box">

    </div>
</body>
</html>
